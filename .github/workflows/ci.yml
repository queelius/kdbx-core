name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --all-features
      - name: Package (publish dry run)
        run: cargo publish --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features keepass-0_12"
          - "--no-default-features --features keepass-0_15"
          - "--features keepass-0_12,keepass-0_15"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (${{ matrix.features }})
        run: cargo test ${{ matrix.features }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build (no default features)
        run: cargo build --target wasm32-unknown-unknown --no-default-features
      - name: Build (kdf)
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features kdf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Test on MSRV (all features)
        run: cargo test --all-features
